        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/analysis/jobs/{jobId}/retry:
    post:
      tags: [Analysis]
      summary: Retry a retryable paid analysis job
      description: Requeues only owned jobs in failed_retryable state. Completed, failed_terminal, cancelled, queued, and active jobs are rejected; no duplicate active job is created.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobId'
      responses:
        '200':
          description: Analysis job requeued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/memories/analysis-jobs:
    get:
      tags: [Analysis]
      summary: List my Memories analysis jobs
      description: Returns only the authenticated user's paid Memories analysis jobs with failure code, retry counters, timestamps, and derived progress.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobStatusFilter'
        - $ref: '#/components/parameters/AnalysisJobRecordingIdFilter'
        - $ref: '#/components/parameters/AnalysisJobSubjectIdFilter'
        - $ref: '#/components/parameters/AnalysisJobLimitFilter'
      responses:
        '200':
          description: Owner analysis jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/analysis-jobs:
    get:
      tags: [Admin, Analysis]
      summary: List all analysis jobs
      description: ADMIN and OPS users can list analysis jobs across owners with the same failure code and progress fields exposed to owners.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobStatusFilter'
        - $ref: '#/components/parameters/AnalysisJobRecordingIdFilter'
        - $ref: '#/components/parameters/AnalysisJobSubjectIdFilter'
        - $ref: '#/components/parameters/AnalysisJobLimitFilter'
      responses:
        '200':
          description: All analysis jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/analysis-jobs/{jobId}/retry:
    post:
      tags: [Admin, Analysis]
      summary: Admin retry for a retryable analysis job
      description: ADMIN and OPS users can requeue a failed_retryable job. The existing job row is requeued, duplicate active jobs are not created, and an analysis_job_retry audit log is written.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobId'
      responses:
        '200':
          description: Analysis job requeued by admin or ops
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/analysis/jobs/{jobId}/transitions/preprocess:
    patch:
      tags: [Admin, Analysis]
      summary: Mark paid analysis preprocessing
      description: Admin worker transition endpoint. Moves queued/leased work into preprocessing, records the worker id when supplied, and sets a lease expiry used by stale-lease cleanup.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerTransitionRequest'
      responses:
        '200':
          description: Analysis job marked preprocessing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
  /api/v1/admin/analysis/jobs/{jobId}/transitions/stt:
    patch:
      tags: [Admin, Analysis]
      summary: Mark STT processing and persist transcript segments
      description: Admin worker transition endpoint. Accepts worker-supplied transcript segments and idempotently upserts them by jobId and segmentIndex.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkSttRequest'
      responses:
        '200':
          description: Analysis job marked STT processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
  /api/v1/admin/analysis/jobs/{jobId}/provider/transcription:
    post:
      tags: [Admin, Analysis]
      summary: Request TalkTo_APP_AI transcription and persist transcript segments
      description: Issues a recording playback URL with at least a 30-minute TTL, sends it to TalkTo_APP_AI with subject/glossary/intake context, retries once for expired or failed audio downloads, and upserts returned transcript segments including confidence.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAiTranscriptionRequest'
      responses:
        '200':
          description: AI transcription persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
  /api/v1/admin/analysis/jobs/{jobId}/transitions/redaction:
    patch:
      tags: [Admin, Analysis]
      summary: Mark paid analysis redaction gate
      description: Admin worker transition endpoint. Marks the job at the redaction gate without running masking providers.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobId'
      responses:
        '200':
          description: Analysis job marked redaction pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
  /api/v1/admin/analysis/jobs/{jobId}/transitions/segmenting:
    patch:
      tags: [Admin, Analysis]
      summary: Mark segmenting and persist memory segments
      description: Admin worker transition endpoint. Accepts worker-supplied memory segments and idempotently upserts them by jobId and segmentIndex.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkSegmentingRequest'
      responses:
        '200':
          description: Analysis job marked segmenting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
  /api/v1/admin/analysis/jobs/{jobId}/transitions/indexing:
    patch:
      tags: [Admin, Analysis]
      summary: Mark indexing and persist embeddings
      description: Admin worker transition endpoint. Accepts worker-supplied embeddings and idempotently upserts them by jobId and embeddingIndex.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkIndexingRequest'
      responses:
        '200':
          description: Analysis job marked indexing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
  /api/v1/admin/analysis/jobs/{jobId}/transitions/completed:
    patch:
      tags: [Admin, Analysis]
      summary: Mark paid analysis completed
      description: Admin worker transition endpoint. Marks the paid analysis job completed and updates recording analysis progress.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobId'
      responses:
        '200':
          description: Analysis job marked completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
  /api/v1/admin/analysis/jobs/{jobId}/transitions/failed:
    patch:
      tags: [Admin, Analysis]
      summary: Mark paid analysis failed
      description: Admin worker transition endpoint. Marks the job retryable or terminal according to its retry budget.
      parameters:
        - $ref: '#/components/parameters/AnalysisJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkFailedRequest'
      responses:
        '200':
          description: Analysis job marked failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
