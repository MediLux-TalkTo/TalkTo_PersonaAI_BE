openapi: 3.0.3
info:
  title: TalkTo Persona AI MVP API
  version: 0.1.0
  description: |
    Backend MVP API design for Persona AI.

    v1.0 source priority: TalkTo_개발자용_기능명세서_v1.0.md overrides older Notion rows,
    pasted planning notes, and the legacy MVP baseline where they conflict.

    Current implemented surface: legacy Persona Chat MVP plus Archive-first
    subjects, purpose consents, question cards/interactions, recording upload,
    recording completion, recording list/detail, original recording playback,
    payment products/orders/webhooks/entitlements, and queued paid Archive
    analysis jobs, analysis job status APIs, audited admin retry hooks, and
    admin worker transition endpoints for paid analysis jobs, and paid Memories
    status/search plus segment playback/feedback over indexed analysis segments,
    in-app analysis status notifications, and R&D redacted export opt-in/preview
    guardrails, public landing pre-registrations, plus Voice Persona application
    core routes.

    Guardrails: free Archive upload/completion must not create Preview, STT,
    LLM summary, embedding, memory segment, or analysis job work. Preview/sample
    analysis is deferred/disabled by v1.0. POST
    /api/v1/recordings/{recordingId}/preview-analysis exists only as a disabled
    compatibility endpoint returning 409 feature_deferred and must not enqueue
    Preview, free AI, or analysis job work.

    Not yet implemented: automated provider execution for analysis workers,
    Voice Persona status notifications.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Auth
  - name: Pre-registrations
    description: Public landing pre-registration intake and Admin/Ops follow-up for contact-bearing records.
  - name: Consent
    description: Purpose consent requirements and acceptance for Archive, paid Memories, and future Voice Persona gates.
  - name: Subjects
  - name: Question Cards
  - name: Recordings
    description: Free Archive recording storage/playback only; no Preview, STT, summary, embedding, memory segment, or analysis job is created.
  - name: Persona
    description: Legacy active persona profile, not the v1.0 Voice Persona build/runtime package.
  - name: Conversations
    description: Legacy Persona Chat text/voice runtime, not the v1.0 Voice Persona runtime.
  - name: Memories
    description: Legacy memory CRUD plus paid v1.0 Memories status/search over analyzed Archive segments. Legacy CRUD rows are not paid search results.
  - name: Memory Segments
    description: Owner-only playback URLs and feedback for paid Memories search result segments.
  - name: Notifications
    description: In-app notification rows for status changes. Current implementation covers paid analysis completion/failure.
  - name: Data Rights
    description: User data-rights controls and admin dry-run previews for redacted research export eligibility.
  - name: Voice Persona
    description: v1.0 Voice Persona build application, review, and runtime-enablement surfaces. Runtime messaging uses the Persona Runtime tag.
  - name: Persona Runtime
    description: Gated v1.0 Voice Persona runtime sessions/messages. Separate from legacy Conversations.
  - name: Orders
    description: Paid product checkout orders. Memories orders require a target recording.
  - name: Payments
    description: Verified payment webhooks create entitlements and queue paid analysis jobs for Memories orders.
  - name: Entitlements
    description: Active paid feature access granted after verified payment.
  - name: Analysis
    description: Durable paid analysis job state, retry/status surface, and admin worker transition endpoints. Transition endpoints persist worker-supplied artifacts; they do not run provider STT, LLM, redaction, segmentation, embedding, or Memories search workers.
  - name: Feedback
  - name: Admin
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      responses:
        '200':
          description: Logout success
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        '200':
          description: Current user profile
  /api/v1/pre-registrations:
    post:
      tags: [Pre-registrations]
      security: []
      summary: Submit a public landing pre-registration
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            format: uuid
          description: Optional UUID v4 reused only when retrying the same submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreRegistrationRequest'
      responses:
        '201':
          description: Pre-registration received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreRegistrationSubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/pre-registrations:
    get:
      tags: [Pre-registrations]
      summary: List pre-registrations for Admin/Ops follow-up
      parameters:
        - in: query
          name: participationType
          schema:
            type: string
            enum: [early_access, survey_10, interview_20]
        - in: query
          name: status
          schema:
            type: string
            enum: [received, contacted, interview_scheduled, closed]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Contact-bearing pre-registration records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPreRegistrationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/pre-registrations/{registrationId}:
    patch:
      tags: [Pre-registrations]
      summary: Update pre-registration follow-up state
      parameters:
        - in: path
          name: registrationId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreRegistrationRequest'
      responses:
        '200':
          description: Pre-registration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPreRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/consents/me:
    get:
      tags: [Consent]
      summary: Get current consent status
      responses:
        '200':
          description: Consent status
  /api/v1/consents/requirements:
    get:
      tags: [Consent]
      summary: Get feature-specific consent requirements
      parameters:
        - in: query
          name: feature
          required: true
          schema:
            type: string
            enum: [archive, memories, voice_persona]
        - in: query
          name: subject_id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Feature consent requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRequirementsResponse'
  /api/v1/consents:
    post:
      tags: [Consent]
      summary: Save consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '201':
          description: Consent saved
  /api/v1/consents/accept:
    post:
      tags: [Consent]
      summary: Accept versioned purpose consents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptConsentsRequest'
      responses:
        '201':
          description: Purpose consents accepted
  /api/v1/personas/active:
    get:
      tags: [Persona]
      summary: Get active persona profile
      responses:
        '200':
          description: Active persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaResponse'
  /api/v1/subjects:
    post:
      tags: [Subjects]
      summary: Create archive subject profile
      responses:
        '201':
          description: Subject created
    get:
      tags: [Subjects]
      summary: List my subjects
      responses:
        '200':
          description: Subject list
  /api/v1/subjects/{subjectId}:
    get:
      tags: [Subjects]
      summary: Get subject detail
      responses:
        '200':
          description: Subject detail
    patch:
      tags: [Subjects]
      summary: Update subject profile
      responses:
        '200':
          description: Subject updated
  /api/v1/subjects/{subjectId}/glossary:
    post:
      tags: [Subjects]
      summary: Add family glossary term
      responses:
        '201':
          description: Glossary term added
  /api/v1/subjects/{subjectId}/glossary/{termId}:
    delete:
      tags: [Subjects]
      summary: Delete family glossary term
      responses:
        '200':
          description: Glossary term deleted
  /api/v1/question-cards:
    get:
      tags: [Question Cards]
      summary: List default question cards
      responses:
        '200':
          description: Question card list
  /api/v1/subjects/{subjectId}/question-interactions:
    post:
      tags: [Question Cards]
      summary: Record question completion, skip, view, or custom question
      responses:
        '201':
          description: Question interaction recorded
  /api/v1/upload-guide:
    get:
      tags: [Recordings]
      summary: Get recording upload guide
      description: Returns supported audio MIME types, max upload size, single-file guidance, allowed upload sources/platforms, upload intent lifecycle values, failure codes, and checksum statuses.
      responses:
        '200':
          description: Recording upload guide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadGuideResponse'
  /api/v1/recordings/upload-intent:
    post:
      tags: [Recordings]
      summary: Create recording upload intent
      description: Creates a recording row and a presigned upload target. Free Archive upload does not create Preview, STT, summary, embedding, memory segment, or analysis jobs.
      responses:
        '201':
          description: Recording upload intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadIntentResponse'
  /api/v1/recordings/{recordingId}/upload-intents/{uploadIntentId}/retry:
    post:
      tags: [Recordings]
      summary: Retry recording upload intent
      description: Creates a fresh upload intent for a failed, canceled, or expired upload intent and returns the new upload URL, storage key, expiry, uploadIntentId, and current recording. Returns retry_not_allowed when the current intent is not retryable.
      parameters:
        - $ref: '#/components/parameters/RecordingId'
        - $ref: '#/components/parameters/UploadIntentId'
      responses:
        '200':
          description: Fresh recording upload intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadIntentResponse'
  /api/v1/recordings/{recordingId}/upload-intents/{uploadIntentId}/cancel:
    post:
      tags: [Recordings]
      summary: Cancel recording upload intent
      description: Cancels an in-progress upload intent with upload_canceled. If the intent is already completed, failed, canceled, or expired, the backend preserves the terminal state and returns the current intent response.
      parameters:
        - $ref: '#/components/parameters/RecordingId'
        - $ref: '#/components/parameters/UploadIntentId'
      responses:
        '200':
          description: Current or cancelled upload intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingUploadIntentStateResponse'
  /api/v1/recordings/{recordingId}/complete:
    post:
      tags: [Recordings]
      summary: Mark recording upload complete
      description: Marks uploadStatus as uploaded/archive_status as archived and keeps analysis_stage not_analyzed, summary_status locked_until_memories, and memories_status locked_until_memories; free Archive completion must not create Preview, STT, summary, embedding, memory segment, or analysis jobs.
      responses:
        '200':
          description: Recording upload completed
  /api/v1/subjects/{subjectId}/recordings:
    get:
      tags: [Recordings]
      summary: List subject recordings
      responses:
        '200':
          description: Recording list
  /api/v1/recordings/{recordingId}:
    get:
      tags: [Recordings]
      summary: Get recording detail
      responses:
        '200':
          description: Recording detail
  /api/v1/recordings/{recordingId}/playback-url:
    post:
      tags: [Recordings]
      summary: Issue expiring original recording playback URL
      responses:
        '200':
          description: Playback URL issued
  /api/v1/recordings/{recordingId}/preview-analysis:
    post:
      tags: [Recordings]
      summary: Disabled Preview analysis compatibility endpoint
      description: Exists only for compatibility while Preview/sample analysis is deferred in v1.0. Always returns 409 feature_deferred and does not create Preview, free AI, STT, summary, embedding, memory segment, or analysis job work.
      parameters:
        - $ref: '#/components/parameters/RecordingId'
      responses:
        '409':
          description: Preview analysis is deferred for v1.0.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: feature_deferred
                      message:
                        type: string
                        example: Preview analysis is deferred for v1.0.
                      details:
                        type: object
                        properties:
                          feature:
                            type: string
                            example: preview_analysis
                          retryable:
                            type: boolean
                            example: false
                  meta:
                    type: object
                    properties:
                      timestamp:
                        type: string
                        format: date-time
  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Create pending checkout order
      description: Creates a pending local checkout order. Memories orders require targetRecordingId and required Memories consents before checkout; no analysis job is created until the verified payment webhook grants an active entitlement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Pending checkout order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
  /api/v1/payments/local/webhook:
    post:
      tags: [Payments]
      security: []
      summary: Receive signed local payment webhook
      description: Verifies the local payment webhook signature and event id before mutating order state. For a payment.succeeded Memories order, creates an active entitlement and queues a paid analysis job for the order target recording after entitlement, consent, archived recording, and duplicate active-job guards pass.
      responses:
        '200':
          description: Payment webhook processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWebhookResponse'
  /api/v1/entitlements:
    get:
      tags: [Entitlements]
      summary: List current active entitlements
      responses:
        '200':
          description: Active entitlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementsResponse'
  /api/v1/memories/status:
    get:
      tags: [Memories]
      summary: Get paid Memories search readiness
      description: Returns active Memories entitlement state and whether indexed analysis memory segments are available for paid search. This is separate from legacy memory CRUD.
      parameters:
        - in: query
          name: subjectId
          schema:
            type: string
            format: uuid
          description: Restrict index readiness counts to one subject.
      responses:
        '200':
          description: Paid Memories readiness status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoriesStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/memories/search:
    post:
      tags: [Memories]
      summary: Search paid Memories over analyzed Archive segments
      description: Requires an active Memories entitlement and required Memories purpose consent. Searches owned memory segments created by completed paid analysis and optional stored embeddings; it does not search legacy memory CRUD rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoriesSearchRequest'
      responses:
        '200':
          description: Paid Memories search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoriesSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/memory-segments/{memorySegmentId}/playback-url:
    post:
      tags: [Memory Segments]
      summary: Issue a segment-scoped playback URL
      description: Returns a short-lived original-audio playback URL with media-fragment start/end semantics and downloadAllowed=false. Owner-only access is enforced and the sensitive read is audited.
      parameters:
        - in: path
          name: memorySegmentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySegmentPlaybackRequest'
      responses:
        '201':
          description: Segment playback URL issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySegmentPlaybackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/memory-segments/{memorySegmentId}/feedback:
    post:
      tags: [Memory Segments]
      summary: Submit feedback for a Memories segment
      description: Upserts rating/tags/comment and optional reported timestamp corrections for an owned paid Memories result segment.
      parameters:
        - in: path
          name: memorySegmentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySegmentFeedbackRequest'
      responses:
        '201':
          description: Segment feedback saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySegmentFeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List current user notifications
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: unreadOnly
          schema:
            type: boolean
      responses:
        '200':
          description: Current user notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark a notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/data-rights/research-export:
    get:
      tags: [Data Rights]
      summary: Get research export opt-in preference
      responses:
        '200':
          description: Current preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchExportPreferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/data-rights/research-export/opt-in:
    post:
      tags: [Data Rights]
      summary: Opt in to redacted research export eligibility
      responses:
        '201':
          description: Opt-in preference saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchExportPreferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/data-rights/research-export/withdraw:
    post:
      tags: [Data Rights]
      summary: Withdraw research export opt-in
      responses:
        '201':
          description: Opt-in withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchExportPreferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/data-deletion-requests:
    post:
      tags: [Data Rights]
      summary: Create a strongly confirmed data deletion request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataDeletionRequest'
      responses:
        '201':
          description: Data deletion request created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/data-rights/research-export-preview:
    get:
      tags: [Admin, Data Rights]
      summary: Preview redacted research export eligible rows
      description: Dry-run preview for admin/ops users. Returns only opted-in memory segment identifiers, timestamps, eligibility state, and redacted text when a successful redaction exists. Raw audio keys, presigned URLs, raw transcripts, and raw memory text are not returned.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: subjectId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Redacted export preview rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchExportPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/data-deletion-requests/{requestId}:
    patch:
      tags: [Admin, Data Rights]
      summary: Update data deletion request status
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataDeletionRequest'
      responses:
        '200':
          description: Deletion request updated
  /api/v1/admin/provider-deletion-records/{recordId}:
    patch:
      tags: [Admin, Data Rights]
      summary: Update provider deletion tracking status
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderDeletionRecord'
      responses:
        '200':
          description: Provider deletion record updated
  /api/v1/voice-persona/applications:
    post:
      tags: [Voice Persona]
      summary: Create a Voice Persona build application
      description: Requires subject ownership, required Voice Persona consents, and an active Voice Persona entitlement. Creates a locked build application and locked build job; it does not enable runtime chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoicePersonaApplicationRequest'
      responses:
        '201':
          description: Voice Persona application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoicePersonaApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/voice-persona/applications/{applicationId}/documents/upload-intent:
    post:
      tags: [Voice Persona]
      summary: Create a Voice Persona evidence document upload intent
      parameters:
        - $ref: '#/components/parameters/VoicePersonaApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoicePersonaDocumentIntentRequest'
      responses:
        '201':
          description: Document upload intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoicePersonaDocumentIntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/voice-persona/applications/{applicationId}/intake:
    put:
