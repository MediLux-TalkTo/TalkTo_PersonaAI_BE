    AnalysisJobRecordingIdFilter:
      in: query
      name: recordingId
      required: false
      schema:
        type: string
        format: uuid
    AnalysisJobSubjectIdFilter:
      in: query
      name: subjectId
      required: false
      schema:
        type: string
