        minimum: 1
        maximum: 100
        default: 50
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: CONFLICT
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
    PreRegistrationRequest:
      type: object
      required: [participationType, name, contact, reason, contactConsent, contactConsentVersion]
      properties:
        participationType:
          type: string
          enum: [early_access, survey_10, interview_20]
        name:
          type: string
          maxLength: 100
        contact:
          type: string
          description: A valid email address or Korean mobile number.
        reason:
          type: string
          enum: [preserve_voice_and_memories, preserve_family_records, voice_persona_interest, other]
        reasonOther:
          type: string
          maxLength: 500
          description: Required when reason is other.
        contactConsent:
          type: boolean
          enum: [true]
        contactConsentVersion:
          type: string
          maxLength: 80
        survey:
          type: object
          description: Required only for participationType survey_10.
          required:
            [firstSituation, recordingAvailability, recordSearchExperience, voiceLossRegret, desiredFeatures, voicePersonaFeeling, concerns]
          properties:
            firstSituation:
              type: string
              enum: [preserve_living_family_voice, revisit_deceased_family_voice, lack_deceased_family_records, leave_my_voice_and_story, curious_about_service]
            recordingAvailability:
              type: string
              enum: [more_than_10, between_3_and_9, between_1_and_2, likely_but_not_found, no_audio_but_other_records, none]
            recordSearchExperience:
              type: string
              enum: [hard_to_find, hard_to_organize, wanted_to_relisten_but_did_not_search, never_thought_to_organize, no_inconvenience, unsure]
            voiceLossRegret:
              type: integer
              enum: [1, 2, 3, 4, 5]
            desiredFeatures:
              type: array
              minItems: 1
              items:
                type: string
                enum: [archive_recordings, organize_records, search_memories, share_with_family, voice_persona, no_special_need]
            voicePersonaFeeling:
              type: string
              enum: [eager, curious_cautious, archive_search_only, ethically_uncomfortable, scary_or_aversive, unsure]
            concerns:
              type: array
              minItems: 1
              items:
                type: string
                enum: [privacy_storage, different_words, emotional_distress, price]
        interview:
          type: object
          description: Required only for participationType interview_20.
          required: [preferredTimeSlots, preferredContactMethod, recordingDuration]
          properties:
            preferredTimeSlots:
              type: array
              minItems: 1
              items:
                type: string
                enum: [weekday_daytime, weekday_evening, weekend_daytime, weekend_evening]
            preferredContactMethod:
              type: string
              enum: [phone, kakao, email, video]
            recordingDuration:
              type: string
              enum: [none, under_10_min, between_10_and_30_min, over_30_min]
        utm:
          type: object
          additionalProperties: false
          properties:
            source:
              type: string
              maxLength: 120
            medium:
              type: string
              maxLength: 120
            campaign:
              type: string
              maxLength: 120
