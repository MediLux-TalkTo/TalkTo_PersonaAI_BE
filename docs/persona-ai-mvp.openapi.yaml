    get:
      tags: [Admin]
      summary: Get v1 operations aggregate counts
      responses:
        '200':
          description: Operations dashboard counts
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed or token is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
    MemoryId:
      in: path
      name: memoryId
      required: true
      schema:
        type: string
    MessageId:
      in: path
      name: messageId
      required: true
      schema:
        type: string
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
    PersonaId:
      in: path
      name: personaId
      required: true
      schema:
        type: string
    RecordingId:
      in: path
      name: recordingId
      required: true
      schema:
        type: string
